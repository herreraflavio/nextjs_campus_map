                  type: "Point",
                  coordinates: [path[0].lon, path[0].lat],
                },
                properties: { role: "start" },
              },
              {
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates: [
                    path[path.length - 1].lon,
                    path[path.length - 1].lat,
                  ],
                },
                properties: { role: "end" },
              },
            ],
          };

          state.map.getSource("route-line").setData(line);
          state.map.getSource("route-points").setData(points);

          const bounds = new maplibregl.LngLatBounds();
          path.forEach((node) => bounds.extend([node.lon, node.lat]));
          state.map.fitBounds(bounds, {
            padding: 80,
            maxZoom: 18,
            duration: 500,
          });

          els.routeSummary.innerHTML = `<strong>Total:</strong> ${
            total >= 1000
              ? `${(total / 1000).toFixed(2)} km`
              : `${Math.round(total)} m`
          }`;
          const routeSteps = buildSteps(path);
          els.routeSteps.innerHTML = "";
          routeSteps.forEach((step) => {
            const li = document.createElement("li");
            li.textContent =
              step.instruction +
              (step.meters > 0
                ? ` - ${step.meters >= 1000 ? `${(step.meters / 1000).toFixed(2)} km` : `${Math.round(step.meters)} m`}`
                : "");
            els.routeSteps.appendChild(li);
          });
        }

        function clearRoute() {
          if (!state.map) return;
          state.map
            .getSource("route-line")
            ?.setData({ type: "FeatureCollection", features: [] });
          state.map
            .getSource("route-points")
            ?.setData({ type: "FeatureCollection", features: [] });
          els.routeSummary.textContent =
            "Pick a start and destination, then Route.";
          els.routeSteps.innerHTML = "";
        }

        function syncRouteIdsFromInputs() {
          const origin = findBestLocationMatchId(els.originInput.value);
          const dest = findBestLocationMatchId(els.destInput.value);
          if (origin) {
            state.route.originId = origin;
            els.originInput.value = labelForNode(origin);
          }
          if (dest) {
            state.route.destId = dest;
            els.destInput.value = labelForNode(dest);
          }
        }

        function wireTurnByTurn() {
          els.turnButton.addEventListener("click", () => {
            setActivePanel(
              els.turnPanel.classList.contains("hidden") ? "turn" : null,
            );
          });
          els.turnClose.addEventListener("click", () => setActivePanel(null));
          els.originInput.addEventListener("change", syncRouteIdsFromInputs);
          els.destInput.addEventListener("change", syncRouteIdsFromInputs);
          els.originPick.addEventListener("click", () => {
            state.route.picking =
              state.route.picking === "origin" ? null : "origin";
            els.originInput.classList.toggle(
              "pick-active",
              state.route.picking === "origin",
            );
            els.destInput.classList.remove("pick-active");
            els.originPick.textContent =
              state.route.picking === "origin" ? "Picking..." : "Pick";
            els.destPick.textContent = "Pick";
          });
          els.destPick.addEventListener("click", () => {
            state.route.picking =
              state.route.picking === "dest" ? null : "dest";
            els.destInput.classList.toggle(
              "pick-active",
              state.route.picking === "dest",
            );
            els.originInput.classList.remove("pick-active");
            els.destPick.textContent =
              state.route.picking === "dest" ? "Picking..." : "Pick";
            els.originPick.textContent = "Pick";
          });
          els.swapRoute.addEventListener("click", () => {
            const origin = state.route.originId;
            state.route.originId = state.route.destId;
            state.route.destId = origin;
            els.originInput.value = labelForNode(state.route.originId);
            els.destInput.value = labelForNode(state.route.destId);
          });
          els.routeButton.addEventListener("click", () => {
            syncRouteIdsFromInputs();
            const result = dijkstra(
              state.routeGraph.nodes,
              state.routeGraph.edges,
              state.route.originId,
              state.route.destId,
            );
            if (result.path.length < 2) {
              els.routeSummary.textContent = "No route found.";
              els.routeSteps.innerHTML = "";
              return;
            }
            drawRoute(result.path, result.total);
          });
          els.clearRoute.addEventListener("click", clearRoute);
        }

        function wireRoutePicker(map) {
          if (!map) return;
          map.on("click", (event) => {
            if (!state.route.picking || !state.routeGraph.publicNodes.length)
              return;
            const wm = lonLatToWebMercator(event.lngLat.lng, event.lngLat.lat);
            let best = state.routeGraph.publicNodes[0];
            let bestDistance = Infinity;
            state.routeGraph.publicNodes.forEach((node) => {
              const d = Math.hypot(node.x - wm.x, node.y - wm.y);
              if (d < bestDistance) {
                bestDistance = d;
                best = node;
              }
            });
            if (state.route.picking === "origin") {
              state.route.originId = best.id;
              els.originInput.value = labelForNode(best.id);
            } else {
              state.route.destId = best.id;
              els.destInput.value = labelForNode(best.id);
            }
            state.route.picking = null;
            els.originInput.classList.remove("pick-active");
            els.destInput.classList.remove("pick-active");
            els.originPick.textContent = "Pick";
            els.destPick.textContent = "Pick";
          });
        }

        function getFacing(a, b) {
          const dx = b[0] - a[0];
          const dy = b[1] - a[1];
          if (Math.abs(dx) > Math.abs(dy)) return dx >= 0 ? "right" : "left";
          return dy >= 0 ? "up" : "down";
        }

        function normalizeAnimation(value) {
          const defaults = {
            enabled: false,
            motion: {
              durationMs: 20000,
              loop: true,
              reverse: false,
              autoPlay: true,
              startProgress: 0,
            },
            sprite: {
              frameMs: 120,
              scale: 1,
              offsetPxX: 0,
              offsetPxY: 0,
              anchor: "bottom",
              directionalFrames: {
                up: [
                  "/sprites/bobcat/up/up-1.png",
                  "/sprites/bobcat/up/up-2.png",
                  "/sprites/bobcat/up/up-3.png",
                  "/sprites/bobcat/up/up-4.png",
                ],
                down: [
                  "/sprites/bobcat/down/down-1.png",
                  "/sprites/bobcat/down/down-2.png",
                  "/sprites/bobcat/down/down-3.png",
                  "/sprites/bobcat/down/down-4.png",
                ],
                left: [
                  "/sprites/bobcat/left/left-1.png",
                  "/sprites/bobcat/left/left-2.png",
                  "/sprites/bobcat/left/left-3.png",
                  "/sprites/bobcat/left/left-4.png",
                ],
                right: [
                  "/sprites/bobcat/right/right-1.png",
                  "/sprites/bobcat/right/right-2.png",
                  "/sprites/bobcat/right/right-3.png",
                  "/sprites/bobcat/right/right-4.png",
                ],
              },
            },
            behavior: { hiddenSegments: [], vertexPauses: [] },
          };
          if (!value || typeof value !== "object") return defaults;
          return {
            enabled:
              typeof value.enabled === "boolean"
                ? value.enabled
                : defaults.enabled,
            motion: Object.assign({}, defaults.motion, value.motion || {}),
            sprite: Object.assign({}, defaults.sprite, value.sprite || {}, {
              directionalFrames: Object.assign(
                {},
                defaults.sprite.directionalFrames,
                value.sprite?.directionalFrames || {},
              ),
            }),
            behavior: Object.assign(
              {},
              defaults.behavior,
              value.behavior || {},
            ),
          };
        }

        function framesFor(animation, facing) {
          const frames = animation.sprite.directionalFrames || {};
          const primary = frames[facing];
          if (Array.isArray(primary) && primary.length) return primary;
          return (
            [frames.down, frames.up, frames.left, frames.right].find(
              (list) => Array.isArray(list) && list.length,
            ) || []
          );
        }

        function clampNumber(value, min, max) {
          return Math.min(max, Math.max(min, value));
        }

        function spriteMapScale() {
          if (!state.map) return 1;
          return 2 ** (state.map.getZoom() - SPRITE_SIZE_REFERENCE_ZOOM);
        }

        function spriteVisualMetrics(animation) {
          const baseSize = Math.max(
            1,
            SPRITE_BASE_SIZE_PX * animation.sprite.scale,
          );
          const scaledSize = baseSize * spriteMapScale();
          const size = Number.isFinite(scaledSize)
            ? Math.max(0.01, scaledSize)
            : baseSize;
          return {
            size,
            offsetScale: size / baseSize,
          };
        }

        function isHiddenSegment(index, animation) {
          return (animation.behavior.hiddenSegments || []).some(
            (range) =>
              index >= range.startSegmentIndex &&
              index <= range.endSegmentIndex,
          );
        }

        function animationPathsForFeature(feature) {
          const geometry = feature?.geometry;
          if (geometry?.type === "LineString") {
            return [geometry.coordinates];
          }
          if (geometry?.type === "MultiLineString") {
            return geometry.coordinates || [];
          }
          return [];
        }

        function buildSpriteRuntimeForPath(
          feature,
          animation,
          coords,
          pathIndex,
        ) {
          const path = Array.isArray(coords)
            ? coords.map((coord) => normalizedLngLat(coord)).filter(Boolean)
            : [];
          if (path.length < 2) return null;

          const originalNodes = path.map((coord) => ({
            lonLat: coord,
            wm: lonLatToWebMercator(coord[0], coord[1]),
          }));
          const reversed = animation.motion.reverse === true;
          const displayNodes = reversed
            ? originalNodes
                .slice()
                .reverse()
                .map((node, index) => ({
                  node,
                  originalVertexIndex: originalNodes.length - 1 - index,
                }))
            : originalNodes.map((node, index) => ({
                node,
                originalVertexIndex: index,
              }));

          const segmentLengths = [];
          let totalLength = 0;
          for (let i = 0; i < displayNodes.length - 1; i++) {
            const a = displayNodes[i].node.wm;
            const b = displayNodes[i + 1].node.wm;
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            segmentLengths.push(len);
            totalLength += len;
          }
          if (totalLength <= 0) return null;

          const pauseByVertex = new Map();
          (animation.behavior.vertexPauses || []).forEach((pause) => {
            pauseByVertex.set(
              pause.vertexIndex,
              (pauseByVertex.get(pause.vertexIndex) || 0) +
                Math.max(0, pause.durationMs || 0),
            );
          });

          const schedule = [];
          const initialFacing = getFacing(
            displayNodes[0].node.lonLat,
            displayNodes[1].node.lonLat,
          );
          const initialPause =
            pauseByVertex.get(displayNodes[0].originalVertexIndex) || 0;
          if (initialPause > 0) {
            schedule.push({
              kind: "pause",
              durationMs: initialPause,
              point: displayNodes[0].node.lonLat,
              facing: initialFacing,
              originalVertexIndex: displayNodes[0].originalVertexIndex,
            });
          }

          const motionDurationMs = Math.max(
            0,
            Number(animation.motion.durationMs) || 0,
          );
          for (let i = 0; i < displayNodes.length - 1; i++) {
            const from = displayNodes[i];
            const to = displayNodes[i + 1];
            const originalSegmentIndex = reversed
              ? originalNodes.length - 2 - i
              : i;
            const facing = getFacing(from.node.lonLat, to.node.lonLat);
            schedule.push({
              kind: "move",
              durationMs: (motionDurationMs * segmentLengths[i]) / totalLength,
              from: from.node.lonLat,
              to: to.node.lonLat,
              facing,
              originalSegmentIndex,
            });
            const pauseAfter = pauseByVertex.get(to.originalVertexIndex) || 0;
            if (pauseAfter > 0) {
              schedule.push({
                kind: "pause",
                durationMs: pauseAfter,
                point: to.node.lonLat,
                facing,
                originalVertexIndex: to.originalVertexIndex,
              });
            }
          }

          const cycleDurationMs = schedule.reduce(
            (sum, item) => sum + Math.max(0, item.durationMs),
            0,
          );
          if (!schedule.length) return null;
          const initialFrames = framesFor(animation, initialFacing);
          if (!initialFrames.length) return null;

          return {
            id: `${featureKey(feature) || "animated-line"}:${pathIndex}`,
            feature,
            animation,
            schedule,
            cycleDurationMs,
            cycleOffsetMs:
              Math.min(
                1,
                Math.max(0, Number(animation.motion.startProgress) || 0),
              ) * Math.max(0, cycleDurationMs),
            lastUrl: initialFrames[0],
            element: null,
            imageElement: null,
            outlineElement: null,
            currentPoint: displayNodes[0].node.lonLat,
            suppressClick: false,
            suppressTimer: 0,
            drag: null,
            startedAt: 0,
          };
        }

        function buildSpriteRuntimes(payload) {
          const features = payload.drawings?.features || [];
          const runtimes = [];

          features.forEach((feature) => {
            if (!feature?.properties?.animation) return;
            const paths = animationPathsForFeature(feature);
            if (!paths.length) return;

            const animation = normalizeAnimation(feature.properties.animation);
            if (!animation.enabled || animation.motion.autoPlay === false)
              return;

            paths.forEach((coords, pathIndex) => {
              const runtime = buildSpriteRuntimeForPath(
                feature,
                animation,
                coords,
                pathIndex,
              );
              if (runtime) runtimes.push(runtime);
            });
          });

          return runtimes;
        }

        function resolveSpriteState(runtime, elapsedMs) {
          const cycleDurationMs = Math.max(0, runtime.cycleDurationMs);
          const rawTime = Math.max(0, elapsedMs + runtime.cycleOffsetMs);
          let timelineMs = rawTime;
          let finished = false;
          if (runtime.animation.motion.loop) {
            timelineMs = cycleDurationMs > 0 ? rawTime % cycleDurationMs : 0;
          } else if (rawTime >= cycleDurationMs) {
            timelineMs = cycleDurationMs;
            finished = true;
          }

          if (cycleDurationMs === 0) {
            const first = runtime.schedule[0];
            return first.kind === "pause"
              ? {
                  point: first.point,
                  facing: first.facing,
                  visible: true,
                  finished,
                }
              : {
                  point: first.to,
                  facing: first.facing,
                  visible: !isHiddenSegment(
                    first.originalSegmentIndex,
                    runtime.animation,
                  ),
                  finished,
                };
          }

          let remaining = timelineMs;
          for (let i = 0; i < runtime.schedule.length; i++) {
            const item = runtime.schedule[i];
            const isLast = i === runtime.schedule.length - 1;
            if (remaining <= item.durationMs || isLast) {
              if (item.kind === "pause") {
                return {
                  point: item.point,
                  facing: item.facing,
                  visible: true,
                  finished,
                };
              }
              const t =
                item.durationMs <= 0
                  ? 1
                  : Math.max(0, Math.min(1, remaining / item.durationMs));
              return {
                point: [
                  item.from[0] + (item.to[0] - item.from[0]) * t,
                  item.from[1] + (item.to[1] - item.from[1]) * t,
                ],
                facing: item.facing,
                visible: !isHiddenSegment(
                  item.originalSegmentIndex,
                  runtime.animation,
                ),
                finished,
              };
            }
            remaining -= item.durationMs;
          }

          const last = runtime.schedule[runtime.schedule.length - 1];
          return last.kind === "pause"
            ? {
                point: last.point,
                facing: last.facing,
                visible: true,
                finished: true,
              }
            : {
                point: last.to,
                facing: last.facing,
                visible: !isHiddenSegment(
                  last.originalSegmentIndex,
                  runtime.animation,
                ),
                finished: true,
              };
        }

        function loadImageForCanvas(src) {
          return new Promise((resolve, reject) => {
            const image = new Image();
            image.crossOrigin = "anonymous";
            image.decoding = "async";
            image.onload = () => resolve(image);
            image.onerror = () => reject(new Error(`Unable to load ${src}`));
            image.src = src;
          });
        }

        function generatedSpriteOutlineUrl(src) {
          const cacheKey = `${src}|${SPRITE_OUTLINE_COLOR}|${SPRITE_OUTLINE_RADIUS_PX}`;
          if (spriteOutlineCache.has(cacheKey)) {
            return spriteOutlineCache.get(cacheKey);
          }

          const promise = loadImageForCanvas(src).then((image) => {
            const width = image.naturalWidth || image.width;
            const height = image.naturalHeight || image.height;
            if (!width || !height)
              throw new Error(`Invalid image size: ${src}`);

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            if (!ctx) throw new Error("Canvas is not available.");

            const radius = Math.max(1, SPRITE_OUTLINE_RADIUS_PX);
            ctx.clearRect(0, 0, width, height);
            for (let y = -radius; y <= radius; y++) {
              for (let x = -radius; x <= radius; x++) {
                if (x * x + y * y <= radius * radius) {
                  ctx.drawImage(image, x, y, width, height);
                }
              }
            }
            ctx.globalCompositeOperation = "source-in";
            ctx.fillStyle = SPRITE_OUTLINE_COLOR;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = "destination-out";
            ctx.drawImage(image, 0, 0, width, height);
            ctx.globalCompositeOperation = "source-over";
            return canvas.toDataURL("image/png");
          });

          spriteOutlineCache.set(cacheKey, promise);
          return promise;
        }

        function setSpriteFrame(runtime, frameUrl) {
          if (!runtime.imageElement || !frameUrl) return;
          runtime.imageElement.src = frameUrl;
          if (!runtime.outlineElement) return;

          runtime.outlineElement.dataset.frameUrl = frameUrl;
          runtime.outlineElement.style.filter = "";
          generatedSpriteOutlineUrl(frameUrl)
            .then((outlineUrl) => {
              if (runtime.outlineElement?.dataset.frameUrl === frameUrl) {
                runtime.outlineElement.src = outlineUrl;
              }
            })
            .catch(() => {
              if (runtime.outlineElement?.dataset.frameUrl !== frameUrl) return;
              runtime.outlineElement.src = frameUrl;
              runtime.outlineElement.style.filter =
                "brightness(0) saturate(100%)";
            });
        }

        function selectSpriteGraphic(runtime) {
          clearSelectedSprite();
          if (!runtime?.element) return;
          state.selectedSpriteId = runtime.id;
          runtime.element.classList.add("is-selected");
        }

        function clearSelectedSprite() {
          state.selectedSpriteId = "";
          state.sprite.items.forEach((runtime) => {
            runtime.element?.classList.remove("is-selected");
          });
        }

        function activeTouchSpriteRuntime() {
          if (!state.sprite.touchRuntimeId) return null;
          return (
            state.sprite.items.find(
              (runtime) => runtime.id === state.sprite.touchRuntimeId,
            ) || null
          );
        }

        function clearSpriteTouchRuntime(runtime) {
          if (runtime && state.sprite.touchRuntimeId !== runtime.id) return;
          state.sprite.touchRuntimeId = "";
          window.clearTimeout(state.sprite.touchTimer);
          state.sprite.touchTimer = 0;
        }

        function trackSpriteTouchRuntime(runtime) {
          if (!runtime) return;
          state.sprite.touchRuntimeId = runtime.id;
          window.clearTimeout(state.sprite.touchTimer);
          state.sprite.touchTimer = window.setTimeout(() => {
            clearSpriteTouchRuntime(runtime);
          }, SPRITE_TOUCH_SESSION_TIMEOUT_MS);
        }

        function cancelSpriteDrag(runtime) {
          const drag = runtime?.drag;
          if (!runtime || !drag) return;
          if (runtime.element?.hasPointerCapture?.(drag.pointerId)) {
            try {
              runtime.element.releasePointerCapture(drag.pointerId);
            } catch (_error) {}
          }
          runtime.element?.classList.remove("is-dragging");
          runtime.drag = null;
        }

        function suppressSpriteClick(
          runtime,
          delayMs = SPRITE_CLICK_SUPPRESS_MS,
        ) {
          if (!runtime) return;
          runtime.suppressClick = true;
          window.clearTimeout(runtime.suppressTimer);
          runtime.suppressTimer = window.setTimeout(() => {
            runtime.suppressClick = false;
            runtime.suppressTimer = 0;
          }, delayMs);
        }

        function touchDistance(touches) {
          if (!touches || touches.length < 2) return 0;
          const a = touches[0];
          const b = touches[1];
          return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
        }

        function touchCenter(touches) {
          if (!touches || touches.length < 2) return null;
          return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2,
          };
        }

        function clampMapZoom(zoom) {
          if (!state.map) return zoom;
          const minZoom =
            typeof state.map.getMinZoom === "function"
              ? state.map.getMinZoom()
              : 0;
          const maxZoom =
            typeof state.map.getMaxZoom === "function"
              ? state.map.getMaxZoom()
              : 24;
          return clampNumber(zoom, minZoom, maxZoom);
        }

        function mapAroundClientPoint(clientX, clientY) {
          if (!state.map) return null;
          const rect = state.map.getContainer().getBoundingClientRect();
          return state.map.unproject([clientX - rect.left, clientY - rect.top]);
        }

        function zoomMapAround(zoom, around) {
          if (!state.map || !around) return;
          state.map.zoomTo(clampMapZoom(zoom), {
            around,
            duration: 0,
          });
          renderSprites(performance.now(), false);
        }

        function startSpritePinch(runtime, event) {
          trackSpriteTouchRuntime(runtime);
          if (!state.map || event.touches.length < 2) return;
          event.preventDefault();
          event.stopPropagation();
          cancelSpriteDrag(runtime);

          const distance = touchDistance(event.touches);
          const center = touchCenter(event.touches);
          if (!distance || !center) return;

          state.sprite.pinch = {
            runtimeId: runtime.id,
            distance,
            zoom: state.map.getZoom(),
            around: mapAroundClientPoint(center.x, center.y),
          };
          suppressSpriteClick(runtime, 400);
        }

        function moveSpritePinch(runtime, event) {
          const pinch = state.sprite.pinch;
          if (!state.map || !pinch || pinch.runtimeId !== runtime.id) return;
          if (event.touches.length < 2) return;
          event.preventDefault();
          event.stopPropagation();

          const distance = touchDistance(event.touches);
          if (!distance || !pinch.distance) return;

          zoomMapAround(
            pinch.zoom + Math.log2(distance / pinch.distance),
            pinch.around,
          );
        }

        function endSpritePinch(runtime, event) {
          const pinch = state.sprite.pinch;
          if (!pinch || pinch.runtimeId !== runtime.id) return;
          if (event.touches.length >= 2) return;
          event.preventDefault();
          event.stopPropagation();
          state.sprite.pinch = null;
          suppressSpriteClick(runtime, 250);
        }

        function handleDocumentSpriteTouchStart(event) {
          const runtime = activeTouchSpriteRuntime();
          if (!runtime || event.touches.length < 2) return;
          startSpritePinch(runtime, event);
        }

        function handleDocumentSpriteTouchMove(event) {
          const runtime = activeTouchSpriteRuntime();
          if (!runtime || event.touches.length < 2) return;
          trackSpriteTouchRuntime(runtime);
          if (!state.sprite.pinch) {
            startSpritePinch(runtime, event);
            return;
          }
          moveSpritePinch(runtime, event);
        }

        function handleDocumentSpriteTouchEnd(event) {
          const runtime = activeTouchSpriteRuntime();
          if (!runtime) return;
          endSpritePinch(runtime, event);
          if (event.touches.length === 0) {
            clearSpriteTouchRuntime(runtime);
          }
        }

        let spriteDocumentTouchBridgeWired = false;
        function wireSpriteDocumentTouchBridge() {
          if (spriteDocumentTouchBridgeWired) return;
          spriteDocumentTouchBridgeWired = true;
          const options = { passive: false, capture: true };
          document.addEventListener(
            "touchstart",
            handleDocumentSpriteTouchStart,
            options,
          );
          document.addEventListener(
            "touchmove",
            handleDocumentSpriteTouchMove,
            options,
          );
          document.addEventListener(
            "touchend",
            handleDocumentSpriteTouchEnd,
            options,
          );
          document.addEventListener(
            "touchcancel",
            handleDocumentSpriteTouchEnd,
            options,
          );
        }

        function wheelSpriteZoom(runtime, event) {
          if (!state.map) return;
          event.preventDefault();
          event.stopPropagation();
          suppressSpriteClick(runtime, 120);

          const around = mapAroundClientPoint(event.clientX, event.clientY);
          const divisor = event.ctrlKey ? 120 : 450;
          zoomMapAround(state.map.getZoom() - event.deltaY / divisor, around);
        }

        function startSpriteDrag(runtime, event) {
          if (!state.map || state.sprite.pinch) return;
          if (event.pointerType === "mouse" && event.button !== 0) return;
          if (event.isPrimary === false) return;
          event.stopPropagation();

          runtime.drag = {
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            lastX: event.clientX,
            lastY: event.clientY,
            moved: false,
          };

          if (event.currentTarget?.setPointerCapture) {
            try {
              event.currentTarget.setPointerCapture(event.pointerId);
            } catch (_error) {}
          }
        }

        function moveSpriteDrag(runtime, event) {
          const drag = runtime.drag;
          if (!state.map || !drag || drag.pointerId !== event.pointerId) return;
          if (state.sprite.pinch) return;
          event.stopPropagation();

          const totalX = event.clientX - drag.startX;
          const totalY = event.clientY - drag.startY;
          const hasMoved =
            Math.hypot(totalX, totalY) > SPRITE_DRAG_CLICK_TOLERANCE_PX;
          if (hasMoved) {
            event.preventDefault();
            drag.moved = true;
            runtime.element?.classList.add("is-dragging");
            runtime.suppressClick = true;
          }

          const dx = event.clientX - drag.lastX;
          const dy = event.clientY - drag.lastY;
          drag.lastX = event.clientX;
          drag.lastY = event.clientY;

          if (!drag.moved || (!dx && !dy)) return;
          state.map.panBy([-dx, -dy], { duration: 0, noMoveStart: true });
          renderSprites(performance.now(), false);
        }

        function endSpriteDrag(runtime, event) {
          const drag = runtime.drag;
          if (!drag || drag.pointerId !== event.pointerId) return;
          event.stopPropagation();
          if (drag.moved) event.preventDefault();

          if (event.currentTarget?.hasPointerCapture?.(event.pointerId)) {
            try {
              event.currentTarget.releasePointerCapture(event.pointerId);
            } catch (_error) {}
          }

          runtime.drag = null;
          runtime.element?.classList.remove("is-dragging");
          if (drag.moved) {
            suppressSpriteClick(runtime);
          } else {
            runtime.suppressClick = false;
          }
        }

        function openSpriteGraphicPopup(runtime, event) {
          event?.preventDefault();
          event?.stopPropagation();
          if (runtime?.suppressClick) return;
          if (!state.map || !runtime?.feature || !runtime.currentPoint) return;

          openFeaturePopup(
            state.map,
            runtime.currentPoint,
            [runtime.feature],
            "drawings-lines",
          );
          selectSpriteGraphic(runtime);
        }

        function wireSpriteElement(runtime, element) {
          wireSpriteDocumentTouchBridge();
          element.addEventListener("click", (event) =>
            openSpriteGraphicPopup(runtime, event),
          );
          element.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            openSpriteGraphicPopup(runtime, event);
          });
          element.addEventListener(
            "touchstart",
            (event) => startSpritePinch(runtime, event),
            { passive: false },
          );
          element.addEventListener(
            "touchmove",
            (event) => moveSpritePinch(runtime, event),
            { passive: false },
          );
          element.addEventListener(
            "touchend",
            (event) => endSpritePinch(runtime, event),
            { passive: false },
          );
          element.addEventListener(
            "touchcancel",
            (event) => endSpritePinch(runtime, event),
            { passive: false },
          );
          element.addEventListener(
            "wheel",
            (event) => wheelSpriteZoom(runtime, event),
            { passive: false },
          );
          element.addEventListener("pointerdown", (event) =>
            startSpriteDrag(runtime, event),
          );
          element.addEventListener("pointermove", (event) =>
            moveSpriteDrag(runtime, event),
          );
          element.addEventListener("pointerup", (event) =>
            endSpriteDrag(runtime, event),
          );
          element.addEventListener("pointercancel", (event) =>
            endSpriteDrag(runtime, event),
          );
        }

        function createSpriteElement(runtime) {
          const element = document.createElement("div");
          element.className = "map-sprite";
          element.tabIndex = 0;
          element.setAttribute("role", "button");
          element.setAttribute(
            "aria-label",
            `Open ${popupTitle(runtime.feature?.properties || {})}`,
          );
          element.dataset.spriteId = runtime.id;

          const outline = document.createElement("img");
          outline.className = "map-sprite-outline";
          outline.alt = "";
          outline.setAttribute("aria-hidden", "true");

          const image = document.createElement("img");
          image.className = "map-sprite-image";
          image.alt = "";
          image.setAttribute("aria-hidden", "true");

          runtime.outlineElement = outline;
          runtime.imageElement = image;
          element.append(outline, image);
          wireSpriteElement(runtime, element);
          setSpriteFrame(runtime, runtime.lastUrl);
          document.body.appendChild(element);
          return element;
        }

        function removeSpriteItems() {
          if (state.sprite.raf) {
            cancelAnimationFrame(state.sprite.raf);
            state.sprite.raf = null;
          }
          state.sprite.pinch = null;
          clearSpriteTouchRuntime();
          state.sprite.items.forEach((runtime) => {
            cancelSpriteDrag(runtime);
            runtime.element?.remove();
            window.clearTimeout(runtime.suppressTimer);
            runtime.element = null;
            runtime.imageElement = null;
            runtime.outlineElement = null;
          });
          state.sprite.items = [];
          state.selectedSpriteId = "";
          if (els.sprite) {
            els.sprite.style.display = "none";
            els.sprite.style.transform = "translate(-9999px, -9999px)";
          }
          if (els.spriteHighlight) {
            els.spriteHighlight.style.transform = "translate(-9999px, -9999px)";
          }
        }

        function positionSprite(runtime, point, visible) {
          const element = runtime?.element;
          const animation = runtime?.animation;
          if (!state.map || !element || !animation || !point || !visible) {
            if (element)
              element.style.transform = "translate(-9999px, -9999px)";
            return;
          }
          const { size, offsetScale } = spriteVisualMetrics(animation);
          const screen = state.map.project(point);
          const xOffset =
            (Number(animation.sprite.offsetPxX) || 0) * offsetScale;
          const yOffset =
            (animation.sprite.anchor === "bottom" ? size / 2 : 0) +
            (Number(animation.sprite.offsetPxY) || 0) * offsetScale;
          element.style.width = `${size}px`;
          element.style.height = `${size}px`;
          element.style.transform = `translate(${screen.x - size / 2 + xOffset}px, ${
            screen.y - size / 2 - yOffset
          }px)`;
        }

        function renderSpriteRuntime(runtime, ts, updateFrame) {
          const result = resolveSpriteState(runtime, ts - runtime.startedAt);
          const frames = framesFor(runtime.animation, result.facing);
          if (!frames.length) {
            positionSprite(runtime, null, false);
            return false;
          }
          if (updateFrame) {
            const frameMs = Math.max(
              1,
              Number(runtime.animation.sprite.frameMs) || 120,
            );
            const nextUrl =
              frames[
                Math.floor((ts - runtime.startedAt) / frameMs) % frames.length
              ] || frames[0];
            if (nextUrl && nextUrl !== runtime.lastUrl) {
              setSpriteFrame(runtime, nextUrl);
              runtime.lastUrl = nextUrl;
            }
          }
          runtime.currentPoint = result.point;
          runtime.visible = result.visible;
          positionSprite(runtime, result.point, result.visible);
          return !result.finished || runtime.animation.motion.loop;
        }

        function renderSprites(ts, updateFrame) {
          let hasActiveSprites = false;
          state.sprite.items.forEach((runtime) => {
            if (renderSpriteRuntime(runtime, ts, updateFrame)) {
              hasActiveSprites = true;
            }
          });
          return hasActiveSprites;
        }

        function startSprite(payload) {
          removeSpriteItems();
          const startedAt = performance.now();
          state.sprite.items = buildSpriteRuntimes(payload).map((runtime) => {
            runtime.startedAt = startedAt;
            runtime.element = createSpriteElement(runtime);
            return runtime;
          });

          if (!state.sprite.items.length) return;

          const frame = (ts) => {
            if (!state.sprite.items.length) return;
            const hasActiveSprites = renderSprites(ts, true);
            state.sprite.raf = hasActiveSprites
              ? requestAnimationFrame(frame)
              : null;
          };

          renderSprites(startedAt, true);
          state.sprite.raf = requestAnimationFrame(frame);
        }

        function featureKey(feature) {
          const properties = feature?.properties || {};
          return String(properties.id ?? feature?.id ?? "");
        }

        function fullDrawingFeature(renderedFeature) {
          const id = featureKey(renderedFeature);
          const drawings = state.payload?.drawings?.features || [];
          const match = drawings.find((feature) => featureKey(feature) === id);
          if (match) return match;
          return {
            type: "Feature",
            geometry: renderedFeature.geometry,
            properties: renderedFeature.properties || {},
          };
        }

        function loadMapImage(map, id, url) {
          return new Promise((resolve, reject) => {
            if (map.hasImage(id)) {
              resolve();
              return;
            }
            let settled = false;
            let timeout = 0;
            const finish = (error, image) => {
              if (settled) return;
              settled = true;
              if (timeout) clearTimeout(timeout);
              if (error || !image) {
                reject(error || new Error(`Failed to load ${url}`));
                return;
              }
              if (!map.hasImage(id)) map.addImage(id, image);
              resolve();
            };
            timeout = setTimeout(() => {
              finish(new Error(`Timed out loading ${url}`));
            }, 2500);

            try {
              const result = map.loadImage(url, (error, image) =>
                finish(error, image),
              );
              if (result && typeof result.then === "function") {
                result
                  .then((image) => finish(null, image?.data || image))
                  .catch((error) => finish(error));
              }
            } catch (error) {
              finish(error);
            }
          });
        }

        async function loadEventPinImages(map) {
          try {
            await Promise.all([
              loadMapImage(map, "event-pin", EVENT_PIN_IMAGE),
              loadMapImage(
                map,
                "event-pin-selected-outline",
                EVENT_PIN_SELECTED_IMAGE,
              ),
            ]);
            state.eventPinsReady = true;
          } catch (error) {
            state.eventPinsReady = false;
            console.warn(
              "MapLibre event pin images failed to load; using circle fallback.",
              error,
            );
          }
        }

        function addCircleEventLayers(map, beforeId) {
          map.addLayer(
            {
              id: "selected-event-outline",
              type: "circle",
              source: "selected-event",
              paint: {
                "circle-radius": 12,
                "circle-color": "rgba(255, 255, 255, 0)",
                "circle-stroke-color": "#0a6cff",
                "circle-stroke-width": 4,
                "circle-translate": EVENT_PIN_SELECTED_OUTLINE_OFFSET,
              },
            },
            beforeId,
          );
          map.addLayer(
            {
              id: "events-points",
              type: "circle",
              source: "events",
              paint: {
                "circle-color": ["coalesce", ["get", "pointColor"], "#dc2626"],
                "circle-opacity": ["coalesce", ["get", "pointOpacity"], 1],
                "circle-radius": ["coalesce", ["get", "pointRadius"], 7],
                "circle-stroke-color": [
                  "coalesce",
                  ["get", "strokeColor"],
                  "#fff",
                ],
                "circle-stroke-width": ["coalesce", ["get", "strokeWidth"], 2],
              },
            },
            beforeId,
          );
        }

        function upgradeEventPinLayers(map) {
          if (
            !state.eventPinsReady ||
            !map.hasImage("event-pin") ||
            !map.hasImage("event-pin-selected-outline") ||
            !map.getSource("events") ||
            !map.getSource("selected-event")
          ) {
            return;
          }

          const beforeId = map.getLayer("labels") ? "labels" : undefined;
          if (map.getLayer("events-points")) map.removeLayer("events-points");
          if (map.getLayer("selected-event-pin")) {
            map.removeLayer("selected-event-pin");
          }
          if (map.getLayer("selected-event-halo")) {
            map.removeLayer("selected-event-halo");
          }
          if (map.getLayer("selected-event-outline")) {
            map.removeLayer("selected-event-outline");
          }

          map.addLayer(
            {
              id: "events-points",
              type: "symbol",
              source: "events",
              layout: {
                "icon-image": "event-pin",
                "icon-size": EVENT_PIN_ICON_SIZE,
                "icon-anchor": "bottom",
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
                "icon-overlap": "always",
              },
            },
            beforeId,
          );

          applyEventFilter();
        }

        function emptyFeatureCollection() {
          return { type: "FeatureCollection", features: [] };
        }

        function cameraChangeIsTiny(
          map,
          center,
          zoom,
          pixelThreshold = CAMERA_PIXEL_EPSILON,
          zoomThreshold = CAMERA_ZOOM_EPSILON,
        ) {
          const targetCenter = normalizedLngLat(center);
          if (!map || !targetCenter) return false;

          const currentCenterPoint = map.project(map.getCenter());
          const targetCenterPoint = map.project(targetCenter);
          const dx = targetCenterPoint.x - currentCenterPoint.x;
          const dy = targetCenterPoint.y - currentCenterPoint.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const targetZoom = Number(zoom);
          const zoomDelta = Number.isFinite(targetZoom)
            ? Math.abs(targetZoom - map.getZoom())
            : 0;

          return distance <= pixelThreshold && zoomDelta <= zoomThreshold;
        }

        function easeCameraIfNeeded(map, center, zoom, options = {}) {
          if (cameraChangeIsTiny(map, center, zoom)) return;
          map.easeTo({
            center,
            zoom,
            ...options,
          });
        }

        function fitBoundsIfNeeded(map, bounds, options) {
          const targetCamera =
            typeof map.cameraForBounds === "function"
              ? map.cameraForBounds(bounds, options)
              : null;
          if (
            targetCamera?.center &&
            cameraChangeIsTiny(
              map,
              targetCamera.center,
              targetCamera.zoom,
              CAMERA_PIXEL_EPSILON,
              CAMERA_ZOOM_EPSILON,
            )
          ) {
            return;
          }
          map.fitBounds(bounds, options);
        }

        function normalizedLngLat(value) {
          if (Array.isArray(value) && value.length >= 2) {
            const lon = Number(value[0]);
            const lat = Number(value[1]);
            if (Number.isFinite(lon) && Number.isFinite(lat)) return [lon, lat];
          }
          if (value && typeof value === "object") {
            const lon = Number(value.lng ?? value.lon ?? value.longitude);
            const lat = Number(value.lat ?? value.latitude);
            if (Number.isFinite(lon) && Number.isFinite(lat)) return [lon, lat];
          }
          return null;
        }

        function selectedEventCoordinates(feature, fallbackLngLat) {
          return (
            normalizedLngLat(feature?.geometry?.coordinates) ||
            normalizedLngLat(fallbackLngLat)
          );
        }

        function showSelectedEventMarker(coordinates) {
          if (!state.map || !window.maplibregl) return;
          clearSelectedEventMarker();

          const element = document.createElement("div");
          element.className = "selected-event-marker";

          const outline = document.createElement("img");
          outline.className = "selected-event-marker-outline";
          outline.src = EVENT_PIN_SELECTED_IMAGE;
          outline.alt = "";
          outline.setAttribute("aria-hidden", "true");

          const pin = document.createElement("img");
          pin.className = "selected-event-marker-pin";
          pin.src = EVENT_PIN_IMAGE;
          pin.alt = "";
          pin.setAttribute("aria-hidden", "true");

          element.append(outline, pin);
          state.selectedEventMarker = new maplibregl.Marker({
            element,
            anchor: "bottom",
          })
            .setLngLat(coordinates)
            .addTo(state.map);
        }

        function clearSelectedEventMarker() {
          if (state.selectedEventMarker) {
            state.selectedEventMarker.remove();
            state.selectedEventMarker = null;
          }
        }

        function selectEvent(renderedFeature, fallbackLngLat) {
          if (!state.map || !renderedFeature) return;
          state.selectedEventId = featureKey(renderedFeature);
          const coordinates = selectedEventCoordinates(
            renderedFeature,
            fallbackLngLat,
          );
          if (!coordinates) {
            clearSelectedEvent();
            return;
          }
          state.map.getSource("selected-event")?.setData({
            type: "FeatureCollection",
            features: [
              {
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates,
                },
                properties: renderedFeature.properties || {},
              },
            ],
          });
          showSelectedEventMarker(coordinates);
          easeCameraIfNeeded(
            state.map,
            coordinates,
            Math.max(state.map.getZoom(), EVENT_PIN_SELECTED_ZOOM),
            {
              duration: 650,
              essential: true,
            },
          );
        }

        function clearSelectedEvent() {
          state.selectedEventId = "";
          clearSelectedEventMarker();
          state.map
            ?.getSource("selected-event")
            ?.setData(emptyFeatureCollection());
        }

        function clearSelectedPolygon() {
          state.map
            ?.getSource("selected-polygon")
            ?.setData(emptyFeatureCollection());
        }

        function clearMapSelection() {
          clearSelectedEvent();
          clearSelectedPolygon();
          clearSelectedSprite();
        }

        function closeActivePopup() {
          const popup = state.activePopup;
          if (popup) {
            state.activePopup = null;
            popup.remove();
          }
          clearMapSelection();
        }

        function extendBounds(bounds, coordinates) {
          let count = 0;
          const visit = (value) => {
            if (!Array.isArray(value)) return;
            if (
              value.length >= 2 &&
              Number.isFinite(Number(value[0])) &&
              Number.isFinite(Number(value[1]))
            ) {
              bounds.extend([Number(value[0]), Number(value[1])]);
              count += 1;
              return;
            }
            value.forEach(visit);
          };
          visit(coordinates);
          return count;
        }

        function selectLine(renderedFeature) {
          if (!state.map || !renderedFeature) return;
          const feature = fullDrawingFeature(renderedFeature);
          if (!feature?.geometry) return;

          state.map.getSource("selected-polygon")?.setData({
            type: "FeatureCollection",
            features: [feature],
          });
        }

        function selectPolygon(renderedFeature) {
          if (!state.map || !renderedFeature) return;
          const feature = fullDrawingFeature(renderedFeature);
          if (!feature?.geometry) return;

          state.map.getSource("selected-polygon")?.setData({
            type: "FeatureCollection",
            features: [feature],
          });

          const bounds = new maplibregl.LngLatBounds();
          const pointCount = extendBounds(bounds, feature.geometry.coordinates);
          if (pointCount > 0) {
            fitBoundsIfNeeded(state.map, bounds, {
              padding: 140,
              maxZoom: 16.5,
              duration: 650,
            });
          }
        }

        const OVERLAY_LAYER_IDS = [
          "selected-event-pin",
          "selected-event-halo",
          "selected-event-outline",
          "labels",
          "events-points",
          "route-points",
          "route-line",
          "drawings-points",
          "drawings-lines",
          "selected-polygon-outline",
          "selected-polygon-halo",
          "drawings-outline",
          "drawings-fill",
        ];
        const OVERLAY_SOURCE_IDS = [
          "selected-event",
          "selected-polygon",
          "route-points",
          "route-line",
          "labels",
          "events",
          "drawings",
        ];

        function mapStyleIsReady(map) {
          if (!map) return false;
          try {
            if (typeof map.isStyleLoaded === "function" && map.isStyleLoaded())
              return true;
            return typeof map.loaded === "function" ? map.loaded() : false;
          } catch (_error) {
            return false;
          }
        }

        function resetOverlayLayers(map) {
          OVERLAY_LAYER_IDS.forEach((layerId) => {
            try {
              if (map.getLayer(layerId)) map.removeLayer(layerId);
            } catch (error) {
              console.warn(`Unable to remove overlay layer ${layerId}.`, error);
            }
          });
          OVERLAY_SOURCE_IDS.forEach((sourceId) => {
            try {
              if (map.getSource(sourceId)) map.removeSource(sourceId);
            } catch (error) {
              console.warn(`Unable to remove overlay source ${sourceId}.`, error);
            }
          });
          state.eventPinsReady = false;
          state.overlaysReady = false;
        }

        function initializeOverlayLayers(map, payload) {
          if (state.overlaysReady) return true;
          if (!mapStyleIsReady(map)) return false;

          try {
            resetOverlayLayers(map);
            addLayers(map, payload);
            state.overlaysReady = true;
            recomputeCalendarDomain();
            applyEventFilter();
            startSprite(payload);
            setStatus("");
            loadEventPinImages(map).then(() => upgradeEventPinLayers(map));
            return true;
          } catch (error) {
            resetOverlayLayers(map);
            console.error("MapLibre overlay layers failed to initialize.", error);
            setStatus("Basemap loaded; retrying map content...", false);
            return false;
          }
        }

        function scheduleOverlayLayerInit(map, payload) {
          let timer = 0;
          let attempts = 0;
          const maxAttempts = 120;

          const cleanup = () => {
            if (timer) clearTimeout(timer);
            map.off("load", run);
            map.off("idle", run);
            map.off("styledata", run);
          };

          const run = () => {
            if (state.overlaysReady) {
              cleanup();
              return;
            }
            if (initializeOverlayLayers(map, payload)) {
              cleanup();
              return;
            }
            attempts += 1;
            if (attempts >= maxAttempts) {
              cleanup();
              setStatus("Basemap loaded, but map content failed to initialize.", true);
              return;
            }
            if (timer) clearTimeout(timer);
            timer = setTimeout(run, 150);
          };

          map.on("load", run);
          map.on("idle", run);
          map.on("styledata", run);
          requestAnimationFrame(run);
          timer = setTimeout(run, 0);
        }

        function addLayers(map, payload) {
          map.addSource("drawings", {
            type: "geojson",
            data: payload.drawings || {
              type: "FeatureCollection",
              features: [],
            },
          });
          map.addSource("events", {
            type: "geojson",
            data: payload.events || { type: "FeatureCollection", features: [] },
          });
          map.addSource("labels", {
            type: "geojson",
            data: payload.labels || { type: "FeatureCollection", features: [] },
          });
          map.addSource("route-line", {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          });
          map.addSource("route-points", {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          });
          map.addSource("selected-polygon", {
            type: "geojson",
            data: { type: "FeatureCollection", features: [] },
          });
          map.addSource("selected-event", {
            type: "geojson",
            data: emptyFeatureCollection(),
          });

          map.addLayer({
            id: "drawings-fill",
            type: "fill",
            source: "drawings",
            filter: ["==", ["geometry-type"], "Polygon"],
            paint: {
              "fill-color": ["coalesce", ["get", "fillColor"], "#4cc9f0"],
              "fill-opacity": ["coalesce", ["get", "fillOpacity"], 0.35],
            },
          });
          map.addLayer({
            id: "drawings-outline",
            type: "line",
            source: "drawings",
            filter: ["==", ["geometry-type"], "Polygon"],
            paint: {
              "line-color": ["coalesce", ["get", "strokeColor"], "#2a2a2a"],
              "line-opacity": ["coalesce", ["get", "strokeOpacity"], 1],
              "line-width": ["coalesce", ["get", "strokeWidth"], 1],
            },
          });
          map.addLayer({
            id: "selected-polygon-halo",
            type: "line",
            source: "selected-polygon",
            paint: {
              "line-color": "#ffffff",
              "line-opacity": 0.95,
              "line-width": 8,
            },
          });
          map.addLayer({
            id: "selected-polygon-outline",
            type: "line",
            source: "selected-polygon",
            paint: {
              "line-color": "#0a6cff",
              "line-opacity": 1,
              "line-width": 4,
            },
          });
          map.addLayer({
            id: "drawings-lines",
            type: "line",
            source: "drawings",
            filter: [
              "any",
              ["==", ["geometry-type"], "LineString"],
              ["==", ["geometry-type"], "MultiLineString"],
            ],
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-color": ["coalesce", ["get", "lineColor"], "#2563eb"],
              "line-opacity": ["coalesce", ["get", "lineOpacity"], 1],
              "line-width": ["coalesce", ["get", "lineWidth"], 3],
            },
          });
          map.addLayer({
            id: "drawings-points",
            type: "circle",
            source: "drawings",
            filter: ["==", ["geometry-type"], "Point"],
            paint: {
              "circle-color": ["coalesce", ["get", "pointColor"], "#ef4444"],
              "circle-opacity": ["coalesce", ["get", "pointOpacity"], 1],
              "circle-radius": ["coalesce", ["get", "pointRadius"], 6],
              "circle-stroke-color": [
                "coalesce",
                ["get", "strokeColor"],
                "#fff",
              ],
              "circle-stroke-width": ["coalesce", ["get", "strokeWidth"], 1],
            },
          });
          map.addLayer({
            id: "route-line",
            type: "line",
            source: "route-line",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": "#0078ff", "line-width": 5 },
          });
          map.addLayer({
            id: "route-points",
            type: "circle",
            source: "route-points",
            paint: {
              "circle-radius": 6,
              "circle-color": [
                "case",
                ["==", ["get", "role"], "start"],
                "#00c800",
                "#dc0000",
              ],
              "circle-stroke-color": "#fff",
              "circle-stroke-width": 1,
            },
          });
          addCircleEventLayers(map);
          map.addLayer({
            id: "labels",
            type: "symbol",
            source: "labels",
            layout: {
              "text-field": ["get", "text"],
              "text-font": ["Open Sans Regular"],
              "text-size": ["coalesce", ["get", "fontSize"], 12],
              "text-anchor": "center",
              "text-allow-overlap": false,
            },
            paint: {
              "text-color": ["coalesce", ["get", "textColor"], "#111827"],
              "text-halo-color": ["coalesce", ["get", "haloColor"], "#fff"],
              "text-halo-width": ["coalesce", ["get", "haloWidth"], 1.5],
            },
          });

          [
            "drawings-fill",
            "drawings-lines",
            "drawings-points",
            "events-points",
          ].forEach((layerId) => {
            map.on("click", layerId, (event) => {
              const features = popupFeaturesForEvent(map, layerId, event);
              if (!features.length) return;
              openFeaturePopup(map, event.lngLat, features, layerId);
            });
            map.on("mouseenter", layerId, () => {
              map.getCanvas().style.cursor = "pointer";
            });
            map.on("mouseleave", layerId, () => {
              map.getCanvas().style.cursor = "";
            });
          });
          wirePopupMapDismissal(map);
        }

        function load() {
          if (!endpoint) {
            setStatus("Add ?id=<map id> or ?endpoint=<json url>.", true);
            return;
          }

          fetch(endpoint, {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          })
            .then((response) => {
              if (!response.ok) {
                throw new Error(
                  `HTTP ${response.status}: ${response.statusText}`,
                );
              }
              return response.json();
            })
            .then(async (payload) => {
              state.payload = payload;
              state.embeddedEventFeatures = payload.events?.features || [];
              state.dynamicEventFeatures = [];
              state.overlaysReady = false;
              const center =
                payload.settings && Array.isArray(payload.settings.center)
                  ? payload.settings.center
                  : DEFAULT_CENTER;
              const zoom =
                payload.settings && Number.isFinite(payload.settings.zoom)
                  ? payload.settings.zoom
                  : DEFAULT_ZOOM;
              const style = await makeMapStyle(payload.settings || {});

              const map = new maplibregl.Map({
                container: "map",
                style,
                center,
                zoom,
                attributionControl: false,
              });
              state.map = map;
              wireRoutePicker(map);

              map.addControl(
                new maplibregl.NavigationControl({ showCompass: false }),
                "bottom-right",
              );
              map.addControl(
                new maplibregl.GeolocateControl({
                  positionOptions: { enableHighAccuracy: true },
                  trackUserLocation: true,
                  showUserHeading: true,
                }),
                "top-right",
              );
              map.addControl(
                new maplibregl.AttributionControl({ compact: true }),
              );

              scheduleOverlayLayerInit(map, payload);

              map.on("move", () => {
                if (state.sprite.items.length) {
                  renderSprites(performance.now(), false);
                }
              });

              loadLocationGraph()
                .then(() => loadDynamicEvents(payload))
                .catch((error) => {
                  els.routeStatus.textContent = `Failed to load search graph: ${error.message}`;
                  els.routeStatus.style.color = "#b91c1c";
                });
            })
            .catch((error) => {
              setStatus(`Failed to load map: ${error.message}`, true);
            });
        }

        wireCalendar();
        wireTurnByTurn();

        let maplibreBooted = false;
        function bootMapLibre() {
          if (maplibreBooted) return;
          if (!window.maplibregl) {
            setStatus("MapLibre failed to load from local assets.", true);
            return;
          }
          maplibreBooted = true;
          load();
        }

        if (window.maplibregl) {
          bootMapLibre();
        } else {
          setStatus("Loading MapLibre...", false);
          window.addEventListener("maplibre-gl-ready", bootMapLibre, {
            once: true,
          });
          window.addEventListener(
            "maplibre-gl-error",
            () => {
              if (!maplibreBooted) {
                setStatus("MapLibre failed to load from local assets.", true);
              }
            },
            { once: true },
          );
          window.setTimeout(() => {
            if (!maplibreBooted && !window.maplibregl) {
              setStatus("MapLibre failed to load from local assets.", true);
            }
          }, 8000);
        }
      })();
    </script>
  </body>
</html>
